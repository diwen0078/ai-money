<style>

  /* 顶部 */
  /* 密码锁 */
  #lock { position:fixed; inset:0; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; }

  .nav { display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid #eee; }

  .nav .title { flex:1; text-align:center; font-size:17px; font-weight:700; }

  /* ===== 日历视图 ===== */
  #viewCal { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .month-picker { display:flex; align-items:center; justify-content:center; padding:10px 0 4px; color:#888; font-size:15px; }
  .month-picker .arr { cursor:pointer; padding:4px 14px; font-size:16px; color:#444; user-select:none; }
  .month-picker .label { min-width:110px; text-align:center; }
  .week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:#999; font-size:12px; padding:6px 0; border-bottom:1px solid #f2f2f2; }
  .month-block { margin-top:6px; }

  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 10px; }
  .cal-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:14px; color:#d0d0d0; border-radius:8px; position:relative; cursor:default; }
  .cal-cell.has { color:#111; font-weight:700; cursor:pointer; }
  .cal-cell.has:hover { background:#f0f0f0; }
  .cal-cell.today { background:#07c160; color:#fff; font-weight:700; }
  .cal-cell .today-tag { position:absolute; bottom:1px; font-size:9px; color:#07c160; font-weight:normal; }
  .cal-cell.today .today-tag { color:#07c160; }
  .hint { text-align:center; color:#999; font-size:12px; padding:14px; }

  /* ===== 列表视图 ===== */
  #viewList { display:none; flex:1; flex-direction:column; min-height:0; }
  .searchbox { width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:18px; font-size:14px; outline:none; background:#fff; color:#111; margin:8px 14px; }
  .screen { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 10px 30px; }
  .row { display:flex; margin:10px 0; }
  .row.user { justify-content:flex-end; }
  .avatar { width:34px; height:34px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .row.user .avatar { order:2; margin-left:8px; background:#e8f5e9; }
  .row.bot .avatar { margin-right:8px; background:#e3f2fd; }
  .bubble { max-width:76%; padding:8px 12px; border-radius:8px; font-size:14px; line-height:1.6; word-break:break-word; white-space:pre-wrap; color:#111; }

  .empty { text-align:center; color:#999; padding:40px 0; font-size:14px; }

// 有记录且有明细的日期
const RECORD_DAYS = Object.keys(DB);
// 标记为"有记录"但明细待整理的其他日期
const MARK_DAYS = [];

const today = new Date();
const y = today.getFullYear(), m = today.getMonth(); // 8-17 → 月索引
let curYear = y, curMonth = m;

const calBody = document.getElementById('calBody');
const monthLabel = document.getElementById('monthLabel');
function daysInMonth(Y,M){ return new Date(Y,M+1,0).getDate(); }
function renderCal(){
  monthLabel.textContent = curYear+'年'+(curMonth+1)+'月';
  const first = new Date(curYear, curMonth, 1).getDay();
  const days = daysInMonth(curYear, curMonth);
  let html = `<div class="month-block"><div class="month-name">${curMonth+1}月</div><div class="cal-grid">`;
  for(let i=0;i<first;i++) html += '<div class="cal-cell"></div>';
  for(let d=1; d<=days; d++){
    const key = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = (curYear===y && curMonth===m && d===today.getDate());
    const hasRecord = RECORD_DAYS.includes(key);
    const hasMark = MARK_DAYS.includes(key);
    const cls = 'cal-cell' + (hasRecord||hasMark ? ' has' : '') + (isToday?' today':'');
    const tag = isToday ? '<span class="today-tag">今天</span>' : '';
    // 有记录的日期可点击进列表；仅标记无明细的点击提示待整理
    if(hasRecord || hasMark){
      html += `<div class="${cls}" onclick="openDay('${key}',${hasRecord})">${d}${tag}</div>`;
    }else{
      html += `<div class="${cls}">${d}${tag}</div>`;
    }
  }
  html += '</div></div>';
  calBody.innerHTML = html;
}
document.getElementById('prevM').onclick = ()=>{ curMonth--; if(curMonth<0){curMonth=11;curYear--;} renderCal(); };
document.getElementById('nextM').onclick = ()=>{ curMonth++; if(curMonth>11){curMonth=0;curYear++;} renderCal(); };

const chat = document.getElementById('chat');
let currentDay = '';
function openDay(key, hasDetail){
  currentDay = key;
  document.getElementById('viewCal').style.display = 'none';
  document.getElementById('viewList').style.display = 'flex';
  const ymd = key.split('-');
  document.getElementById('listTitle').textContent = `${ymd[0]}年${+ymd[1]}月${+ymd[2]}日`;
  document.getElementById('search').value = '';
  const list = DB[key];
  if(!hasDetail || !list){
    chat.innerHTML = '<div class="empty">该日期有对话记录，明细正在整理中…</div>';
    return;
  }
  renderList();
}
function renderList(){
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const list = DB[currentDay] || [];
  chat.innerHTML = '';
  let shown = 0;
  list.forEach(it=>{
    const hit = !kw || it.m.toLowerCase().includes(kw);
    if(!hit) return; shown++;
    const row = document.createElement('div');
    row.className = 'row '+ (it.who==='user'?'user':'bot');
    const isU = it.who==='user';
    row.innerHTML = `<div class="avatar">${isU?'🧔':'🦞'}</div>`+
      `<div class="bubble${hit?' matched':''}"><span class="who-line">${isU?'【老大】':'【小龙虾】'} ${it.t||''}</span>${it.m}</div>`;
    chat.appendChild(row);
  });
  if(kw && shown===0) chat.innerHTML = '<div class="empty">当天没有匹配到相关记录</div>';
}
document.getElementById('search').addEventListener('input', renderList);
document.getElementById('btnBack').onclick = ()=>{
  document.getElementById('viewList').style.display = 'none';
  document.getElementById('viewCal').style.display = 'block';
};
renderCal();

/* ===== 密码锁 ===== */
const PASS_HASH="050eebba2ae8a6279eb331538d6db72f8ca72b70819dcba72e4169464e52307e";
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function check(){const e=document.getElementById("pwErr");const pw=document.getElementById("pw").value;if(!pw){e.textContent="请输入密码";return;}const h=await sha256(pw);if(h===PASS_HASH){document.getElementById("lock").style.display="none";}else{e.textContent="密码错误，请重试";document.getElementById("pw").value="";}}
document.getElementById("pwBtn").onclick=check;
document.getElementById("pw").addEventListener("keydown",function(ev){if(ev.key==="Enter")check();});
