const RECORD_DAYS = Object.keys(DB);
const MARK_DAYS = [];
const today = new Date();
const y = today.getFullYear(), m = today.getMonth(); // 0-based
let curYear = y, curMonth = m;

const calBody = document.getElementById('calBody');
const monthLabel = document.getElementById('monthLabel');
function daysInMonth(Y,M){ return new Date(Y,M+1,0).getDate(); }
function renderCal(){
  monthLabel.textContent = curYear+'年'+(curMonth+1)+'月';
  const first = new Date(curYear, curMonth, 1).getDay();
  const days = daysInMonth(curYear, curMonth);
  let html = `<div class="month-block"><div class="month-name">${curMonth+1}月</div><div class="cal-grid">`;
  for(let i=0;i<first;i++) html += '<div class="cal-cell"></div>';
  for(let d=1; d<=days; d++){
    const key = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = (curYear===y && curMonth===m && d===today.getDate());
    const hasRecord = RECORD_DAYS.includes(key);
    const hasMark = MARK_DAYS.includes(key);
    const cls = 'cal-cell' + (hasRecord||hasMark ? ' has' : '') + (isToday?' today':'');
    const tag = isToday ? '<span class="today-tag">今天</span>' : '';
    if(hasRecord || hasMark){
      html += `<div class="${cls}" onclick="openDay('${key}',${hasRecord})">${d}${tag}</div>`;
    }else{
      html += `<div class="${cls}">${d}${tag}</div>`;
    }
  }
  html += '</div></div>';
  calBody.innerHTML = html;
}
document.getElementById('prevM').onclick = ()=>{ curMonth--; if(curMonth<0){curMonth=11;curYear--;} renderCal(); };
document.getElementById('nextM').onclick = ()=>{ curMonth++; if(curMonth>11){curMonth=0;curYear++;} renderCal(); };

const chat = document.getElementById('chat');
let currentDay = '';
function openDay(key, hasDetail){
  currentDay = key;
  document.getElementById('viewCal').style.display = 'none';
  document.getElementById('viewList').style.display = 'flex';
  const ymd = key.split('-');
  document.getElementById('listTitle').textContent = `${ymd[0]}年${+ymd[1]}月${+ymd[2]}日`;
  document.getElementById('search').value = '';
  const list = DB[key];
  if(!hasDetail || !list){
    chat.innerHTML = '<div class="empty">该日期有对话记录，明细正在整理中…</div>';
    return;
  }
  renderList();
}
function renderList(){
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const list = DB[currentDay] || [];
  chat.innerHTML = '';
  let shown = 0;
  list.forEach(it=>{
    const hit = !kw || it.m.toLowerCase().includes(kw);
    if(!hit) return; shown++;
    const row = document.createElement('div');
    row.className = 'row '+ (it.who==='user'?'user':'bot');
    const isU = it.who==='user';
    row.innerHTML = `<div class="avatar">${isU?'🧔':'🦞'}</div>`+
      `<div class="bubble${kw&&hit?' matched':''}"><span class="who-line">${isU?'【老大】':'【小龙虾】'} ${it.t||''}</span>${it.m}</div>`;
    chat.appendChild(row);
  });
  if(kw && shown===0) chat.innerHTML = '<div class="empty">当天没有匹配到相关记录</div>';
}
document.getElementById('search').addEventListener('input', renderList);
document.getElementById('btnBack').onclick = ()=>{
  document.getElementById('viewList').style.display = 'none';
  document.getElementById('viewCal').style.display = 'block';
};
renderCal();

/* ===== 密码锁 ===== */
const PASS_HASH="050eebba2ae8a6279eb331538d6db72f8ca72b70819dcba72e4169464e52307e";
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function check(){const e=document.getElementById("pwErr");const pw=document.getElementById("pw").value;if(!pw){e.textContent="请输入密码";return;}const h=await sha256(pw);if(h===PASS_HASH){document.getElementById("lock").style.display="none";}else{e.textContent="密码错误，请重试";document.getElementById("pw").value="";}}
document.getElementById("pwBtn").onclick=check;
document.getElementById("pw").addEventListener("keydown",function(ev){if(ev.key==="Enter")check();});
</script>
