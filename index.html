<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>教你用AI搞钱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#0d0d0d;color:#eee;padding-bottom:75px}

/* ===== 顶部 ===== */
.top{background:linear-gradient(135deg,#1a0a0a 0%,#2d1500 50%,#1a0a0a 100%);padding:18px 14px 16px;text-align:center;position:relative;overflow:hidden}
.top::before{content:'';position:absolute;top:-40%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse at 30% 20%,rgba(255,100,0,0.06) 0%,transparent 60%);pointer-events:none}
.top-badge{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:6px;margin-bottom:4px;position:relative;z-index:1}
.top-badge2{font-size:12px;font-weight:700;letter-spacing:4px;margin-bottom:6px;position:relative;z-index:1;background:linear-gradient(90deg,#ffcc66,#ffaa33);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top h1{font-size:22px;font-weight:900;margin-bottom:2px;position:relative;z-index:1;background:linear-gradient(135deg,#ff6b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top p{font-size:12px;opacity:.7;position:relative;z-index:1;color:rgba(255,255,255,0.6)}
.top .sub{font-size:11px;margin-top:6px;opacity:.4;position:relative;z-index:1;letter-spacing:2px}

/* ===== 两板块概览 ===== */
.features{display:flex;gap:8px;padding:12px 10px 8px}
.feature{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.feature .fi{font-size:20px;margin-bottom:3px}
.feature .ft{font-size:12px;font-weight:600;color:#fff}
.feature .fd{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px}
.feature.money{border-color:rgba(255,107,0,0.25);background:rgba(255,107,0,0.05)}
.feature.psy{border-color:rgba(100,200,255,0.2);background:rgba(100,200,255,0.04)}

/* 二维码区 */
.qr-area{text-align:center;padding:8px 0;margin:0 10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:pointer}
.qr-area img{width:72px;height:72px;border-radius:6px;display:block;margin:0 auto}
.qr-area .qr-t{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;letter-spacing:1px}

/* 分类 */
.cats{display:flex;gap:6px;padding:10px 10px 6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-block;padding:5px 12px;border-radius:14px;font-size:12px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);cursor:pointer;flex-shrink:0}
.cat.on{background:linear-gradient(135deg,#ff6b00,#ff8800);color:#fff;font-weight:600}

/* 新帖按钮 */
.new-btn{position:fixed;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ff6b00,#ffaa00);color:#fff;border:none;font-size:26px;box-shadow:0 4px 16px rgba(255,107,0,.4);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}

/* 帖子列表 */
.posts{padding:6px 10px}
.post{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
.post .h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.post .h .t{font-size:15px;font-weight:600;flex:1;line-height:1.3;color:#eee}
.post .h .tag{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(255,107,0,0.12);color:#ff8800;white-space:nowrap;margin-left:8px;flex-shrink:0}
.post .c{font-size:12px;color:rgba(255,255,255,0.5);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.post .f{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.3)}
.post .f .n{color:#ff8800;font-weight:500}

.empty{text-align:center;padding:50px 20px;color:rgba(255,255,255,0.2);font-size:13px}
.empty .icon{font-size:48px;margin-bottom:10px}

/* 弹窗 */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:98;justify-content:center;align-items:flex-end}
.overlay.s{display:flex}
.sheet{background:#1a1a1a;width:100%;max-width:450px;border-radius:16px 16px 0 0;padding:18px;max-height:85vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-size:16px;font-weight:600;margin-bottom:14px;text-align:center;color:#eee}
.field{margin-bottom:12px}
.field label{font-size:12px;color:rgba(255,255,255,0.5);display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:14px;outline:none;font-family:inherit;background:rgba(255,255,255,0.05);color:#eee}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#ff6b00}
.field select option{background:#1a1a1a;color:#eee}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#ff6b00,#ffaa00);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.btn:active{opacity:.8}

/* 详情页 */
.detail-post{padding:0}
.detail-post .dp-h{padding:14px 0 10px}
.detail-post .dp-h .dp-t{font-size:18px;font-weight:700;margin-bottom:4px;color:#eee}
.detail-post .dp-h .dp-m{font-size:11px;color:rgba(255,255,255,0.4);display:flex;gap:10px;flex-wrap:wrap}
.detail-post .dp-h .dp-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(255,107,0,0.12);color:#ff8800}
.detail-post .dp-c{font-size:14px;line-height:1.6;color:rgba(255,255,255,0.7);padding:0 0 14px}
.detail-post .dp-reply-title{font-size:14px;font-weight:600;color:#ccc;margin-bottom:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)}
.detail-post .reply{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.detail-post .reply:last-child{border:none}
.detail-post .reply .r-n{font-size:12px;color:#ff8800;font-weight:500;margin-bottom:2px}
.detail-post .reply .r-c{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.4}
.detail-post .reply .r-t{font-size:10px;color:rgba(255,255,255,0.25);margin-top:2px}
.reply-form{display:flex;gap:8px;padding:10px 0;position:sticky;bottom:0;background:#1a1a1a}
.reply-form input{flex:1;padding:8px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:13px;outline:none;background:rgba(255,255,255,0.05);color:#eee}
.reply-form input:focus{border-color:#ff6b00}
.reply-form button{padding:8px 14px;background:linear-gradient(135deg,#ff6b00,#ff8800);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.loading{text-align:center;padding:20px;color:rgba(255,255,255,0.3);font-size:12px}
.close-btn{position:fixed;top:50px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:18px;z-index:99;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>

function loadData(){

// ====== 分类渲染 ======
function renderCats(){
  var h = '<span class="cat on" data-cat="全部">全部</span>';
  CATS.forEach(function(c){ h += '<span class="cat" data-cat="' + c + '">' + c + '</span>'; });
  document.getElementById('cats').innerHTML = h;
  var sel = document.getElementById('catSelect');
  sel.innerHTML = CATS.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
  document.querySelectorAll('.cat').forEach(function(el){
    el.addEventListener('click', function(){
      curCat = this.getAttribute('data-cat');
      document.querySelectorAll('.cat').forEach(function(x){ x.className = 'cat'; });
      this.className = 'cat on';
      renderPosts();
    });
  });
}

    var content = (p.content || '').substring(0,100);
    if((p.content||'').length > 100) content += '...';
    h += '<div class="post" data-id="' + p.id + '"><div class="h"><div class="t">' + esc(p.title) + '</div><div class="tag">' + esc(p.cat) + '</div></div><div class="c">' + esc(content) + '</div><div class="f"><span class="n">' + esc(p.nick) + '</span><span>' + (p.replies ? p.replies.length : 0) + ' 回复 · ' + fmtTime(p.time) + '</span></div></div>';
  });
  cont.innerHTML = h;
  cont.querySelectorAll('.post').forEach(function(el){
    el.addEventListener('click', function(){ showDetail(this.getAttribute('data-id')); });
  });
}

// ====== 帖子详情 ======
function showDetail(id){
  detailId = id;
  var p = null;
  for(var i=0;i<allPosts.length;i++){ if(allPosts[i].id === id){ p = allPosts[i]; break; } }
  if(!p){ alert('帖子不见了'); return; }
  var h = '<div class="dp-h"><div class="dp-t">' + esc(p.title) + '</div><div class="dp-m"><span class="dp-tag">' + esc(p.cat) + '</span><span>' + esc(p.nick) + '</span><span>' + fmtTime(p.time) + '</span></div></div><div class="dp-c">' + esc(p.content) + '</div>';
  if(p.replies && p.replies.length > 0){
    h += '<div class="dp-reply-title">💬 ' + p.replies.length + ' 条回复</div>';
    p.replies.forEach(function(r){
      h += '<div class="reply"><div class="r-n">' + esc(r.nick) + '</div><div class="r-c">' + esc(r.content) + '</div><div class="r-t">' + fmtTime(r.time) + '</div></div>';
    });
  } else {
    h += '<div class="dp-reply-title" style="color:rgba(255,255,255,0.3)">还没有回复，抢个沙发吧</div>';
  }
  document.getElementById('detailContent').innerHTML = h;
  document.getElementById('detailOverlay').className = 'overlay s';
}

// ====== 工具函数 ======
function esc(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(t){ var d=new Date(t); return d.getMonth()+1+'月'+d.getDate()+'日'; }

// ====== 二维码点击 ======
document.getElementById('qrArea').addEventListener('click',function(){
  if(navigator.share){
    navigator.share({title:'教你用AI搞钱',text:'南宁AI实战圈子，扫码加入！',url:'https://diwen0078.github.io/ai-money/'});
  } else {
    var i = document.createElement('input');
    i.value = 'https://diwen0078.github.io/ai-money/';
    document.body.appendChild(i); i.select(); document.execCommand('copy'); document.body.removeChild(i);
    alert('链接已复制');
  }
});

// ====== 发布 ======
document.getElementById('newBtn').addEventListener('click',function(){
  document.getElementById('postOverlay').className = 'overlay s';
  var n = getNick();
  document.getElementById('nickInput').value = n;
});
document.getElementById('postClose').addEventListener('click',function(){ document.getElementById('postOverlay').className = 'overlay'; });
document.getElementById('detailClose').addEventListener('click',function(){ document.getElementById('detailOverlay').className = 'overlay'; });
document.getElementById('submitBtn').addEventListener('click',function(){
  var nick = document.getElementById('nickInput').value.trim() || getNick();
  var cat = document.getElementById('catSelect').value;
  var title = document.getElementById('titleInput').value.trim();
  var content = document.getElementById('contentInput').value.trim();
  if(!title || !content){ alert('标题和内容不能为空'); return; }
  localStorage.setItem('myNick', nick);
  var post = { id: 'u' + Date.now(), title: title, content: content, cat: cat, nick: nick, time: Date.now(), replies: [] };
  var localPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
  localPosts.push(post);
  localStorage.setItem('myPosts', JSON.stringify(localPosts));
  allPosts.push(post);
  document.getElementById('postOverlay').className = 'overlay';
  document.getElementById('titleInput').value = '';
  document.getElementById('contentInput').value = '';
  renderPosts();
});

// ====== 回复 ======
document.getElementById('replyBtn').addEventListener('click',function(){
  var text = document.getElementById('replyInput').value.trim();
  if(!text){ alert('写点什么吧'); return; }
  var nick = getNick();
  for(var i=0;i<allPosts.length;i++){
    if(allPosts[i].id === detailId){
      if(!allPosts[i].replies) allPosts[i].replies = [];
      allPosts[i].replies.push({ nick: nick, content: text, time: Date.now() });
      // 更新localStorage
      var localPosts = JSON.parse(localStorage.getItem('myPosts') || '[]');
      for(var j=0;j<localPosts.length;j++){
        if(localPosts[j].id === detailId){
          localPosts[j].replies = allPosts[i].replies;
          localStorage.setItem('myPosts', JSON.stringify(localPosts));
          break;
        }
      }
      document.getElementById('replyInput').value = '';
      showDetail(detailId);
      renderPosts();
      return;
    }
  }
});

// ====== 启动 ======
loadData();
</script>
</body>
</html>
